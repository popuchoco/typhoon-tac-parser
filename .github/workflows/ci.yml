name: Source validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8.0"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python source
        run: python -m compileall -q typhoon_tac_parser tools
      - name: Check frontend JavaScript
        run: |
          node --check dashboard/common.js
          node --check dashboard/plot.js
          node --check dashboard/predict.js
