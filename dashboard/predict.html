<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>座標預測工具</title><link rel="stylesheet" href="workbench.css?v=2"></head>
<body>
  <header class="topbar"><div><p class="eyebrow">Manual Forecast App</p><h1>座標預測工具</h1></div><nav class="top-actions"><a class="button" href="index.html">工作台首頁</a><a class="button" href="plot.html">路徑繪圖</a></nav></header>
  <main class="shell predict-layout">
    <section class="predict-controls">
      <div class="notice">本頁只做手動座標預測。它不讀取、不解析、不修改任何報文。</div>
      <form id="forecastForm" class="card">
        <div class="section-title"><h2>目前與前一位置</h2></div>
        <div class="form-grid">
          <label>目前緯度<input id="currentLat" type="number" step="0.1" value="15.0" required></label>
          <label>目前經度<input id="currentLon" type="number" step="0.1" value="125.0" required></label>
          <label>前一緯度<input id="previousLat" type="number" step="0.1" placeholder="可留白"></label>
          <label>前一經度<input id="previousLon" type="number" step="0.1" placeholder="可留白"></label>
          <label>前一位置間隔（小時）<input id="previousInterval" type="number" step="1" value="6"></label>
          <label>預報步長（小時）<input id="stepHours" type="number" step="1" value="6" min="1"></label>
        </div>
        <div class="section-title" style="margin-top:18px"><h2>沒有前一位置時的初始移動</h2></div>
        <div class="form-grid"><label>方向<select id="initialDirection"><option value="">無／靜止</option><option>N</option><option>NE</option><option>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option></select></label><label>速度（KT）<input id="initialSpeed" type="number" step="1" value="0"></label></div>
        <div class="section-title" style="margin-top:18px"><h2>環境與模型控制</h2></div>
        <label>慣性（越高越依賴前一時段移動）<div class="range-row"><input id="inertia" type="range" min="0" max="1" step="0.01" value="0.65"><output id="inertiaValue">0.65</output></div></label>
        <div class="form-grid" style="margin-top:10px"><label>西風帶最南緯度<input id="westerlyLat" type="number" step="0.1" value="20"></label><label>西風引導速度（KT）<input id="westerlySpeed" type="number" step="1" value="12"></label><label>預報時限（小時）<input id="horizonHours" type="number" step="6" value="240"></label></div>
        <div class="section-title" style="margin-top:18px"><h2>高壓中心</h2><button id="addHigh" type="button">新增高壓</button></div>
        <p class="small">高壓以圓周切向引導流表示；此為透明研究用 heuristic，不是官方分析場。</p><div id="highRows"></div>
        <div class="section-title" style="margin-top:18px"><h2>鄰近熱帶系統</h2><button id="addNearby" type="button">新增系統</button></div>
        <p class="small">用於簡化的鄰近系統相互作用；不會從報文自動帶入。</p><div id="nearbyRows"></div>
        <div class="actions"><button class="primary" type="submit">產生研究用路徑</button><button id="clearForm" type="button">清除附加場</button><button id="resetForecast" type="button">重設預測工具</button></div>
      </form>
    </section>
    <section class="predict-results">
      <div class="card"><div class="section-title"><h2>預測路徑</h2><button id="downloadForecast" type="button">下載 JSON</button></div><div id="forecastStatus" class="muted">尚未產生路徑。</div><div class="canvas-wrap" style="margin-top:10px"><canvas id="forecastCanvas" aria-label="預測路徑圖"></canvas></div><p class="small map-bounds">底圖經度範圍：101°E～155°E；緯度範圍：8°N～38°N。</p></div>
      <div class="card"><h2>座標表</h2><div id="forecastTable" class="table-wrap muted">產生路徑後顯示。</div></div>
    </section>
  </main>
  <script src="assets/east-asia-land.js?v=4"></script><script src="common.js?v=13"></script><script src="predict.js?v=6"></script>
</body>
</html>
